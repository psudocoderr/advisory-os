version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Next and its ESLint config are version-locked to each other.
      next:
        patterns: ["next", "eslint-config-next"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      types:
        patterns: ["@types/*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
